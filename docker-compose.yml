# One command brings up the whole backend (spec §5.2, NFR-7):  DAY1_SALT=<salt> docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DATABASE_URL: postgresql+psycopg://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
